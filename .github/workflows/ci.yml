name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build --product strata
      - name: Test
        run: swift test
      - name: Bundle (ad-hoc signed)
        run: scripts/build-app.sh --identity adhoc --out dist
      - name: Lint scripts
        run: bash -n install.sh uninstall.sh scripts/*.sh && plutil -lint packaging/*.plist
      - uses: actions/upload-artifact@v4
        with:
          name: Strata-adhoc
          path: dist/*.zip
